<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:system-ui,Arial,sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh;display:flex;justify-content:center;padding:12px}
  .app{width:100%;max-width:480px;display:flex;flex-direction:column;gap:10px;align-items:center}
  header{width:100%;display:flex;justify-content:space-between;align-items:center;font-size:17px}
  header small{color:#94a3b8;font-size:12px;display:block}
  #slots{width:100%;display:flex;flex-wrap:wrap;gap:8px 14px;justify-content:center;min-height:90px;background:#1e293b;border-radius:14px;padding:12px}
  .word{display:flex;gap:3px}
  .box{min-width:26px;height:28px;padding:0 3px;border-radius:6px;background:#0f172a;border:1px solid #334155;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;text-transform:uppercase}
  .box.on{background:#22c55e;border-color:#22c55e;color:#fff}
  .box.hint{background:#fbbf24;border-color:#fbbf24;color:#0f172a}
  #toast{height:22px;color:#fbbf24;font-size:15px}
  #cur{height:36px;font-size:24px;font-weight:700;text-transform:uppercase;letter-spacing:2px;background:#2563eb;padding:0 14px;border-radius:10px;display:flex;align-items:center;visibility:hidden}
  #cur.show{visibility:visible}
  #wheelBox{position:relative;width:290px;height:290px;border-radius:50%;background:#1e293b;touch-action:none;user-select:none;-webkit-user-select:none}
  #wheel{position:absolute;inset:0;touch-action:none}
  #trail{position:absolute;inset:0;pointer-events:none}
  .tile{position:absolute;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:#e2e8f0;color:#0f172a;font-weight:800;font-size:24px;text-transform:uppercase;display:flex;align-items:center;justify-content:center;pointer-events:auto}
  .tile.two{font-size:19px}
  .tile.sel{background:#22c55e;color:#fff}
  .btns{display:flex;gap:10px}
  button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:10px 16px;background:#475569;color:#fff;font-weight:600}
  button.go{background:#22c55e}
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;padding:20px}
  .overlay .card{background:#1e293b;border-radius:14px;padding:22px;max-width:380px;text-align:center;line-height:1.5}
  .overlay h2{margin-bottom:8px}
  .hidden{display:none}
</style>

/*LOGIC*/
const CYR={'а':'a','б':'b','в':'v','г':'g','д':'d','ж':'j','з':'z','и':'i','й':'y','к':'k','л':'l','м':'m','н':'n','о':'o','п':'p','р':'r','с':'s','т':'t','у':'u','ф':'f','х':'x','ц':'s','ч':'ch','ш':'sh','ъ':"'",'ь':'','э':'e','ю':'yu','я':'ya','ў':"o'",'қ':'q','ғ':"g'",'ҳ':'h','ё':'yo'};
function cyr2lat(w){
  if(!/[\u0400-\u04FF]/.test(w)) return w;
  let out='';
  for(let i=0;i<w.length;i++){
    const c=w[i];
    if(c==='е'){ out+=(i===0||'aeiou'.includes(out[out.length-1]))?'ye':'e'; }
    else out+=(CYR[c]!==undefined?CYR[c]:c);
  }
  return out;
}
const normW=w=>w.toLowerCase().replace(/ö/g,"o'").replace(/ğ/g,"g'").replace(/ç/g,"ch").replace(/ş/g,"sh").replace(/ı/g,"i").replace(/[‘’ʻʼ`´]/g,"'").trim();
function toks(w){const t=[];for(let i=0;i<w.length;){const two=w.substr(i,2);if(two==="g'"||two==="o'"||two==="sh"||two==="ch"){t.push(two);i+=2;}else{t.push(w[i]);i++;}}return t;}
function okWord(w){
  if(w.length<2||w.length>14) return false;
  if(!/^[a-z']+$/.test(w)) return false;
  if(/(^|[^go])'/.test(w)||/''/.test(w)) return false;
  if(/w/.test(w)||/c(?!h)/.test(w)) return false;
  return true;
}
function parseWords(text){
  const out=new Set();
  for(const line of text.split(/\r?\n/)){
    let w=line.trim().split(/\s+/)[0]; if(!w) continue;
    w=w.split('/')[0];
    w=normW(cyr2lat(w.toLowerCase()));
    if(okWord(w)) out.add(w);
  }
  return [...out];
}
function rng(seed){let a=seed>>>0;return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuffle(a,r){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function mkIndex(words){
  const list=words.map(w=>{const t=toks(w),m={};t.forEach(x=>m[x]=(m[x]||0)+1);return{w,n:t.length,m};});
  const byLen={};list.forEach(o=>(byLen[o.n]=byLen[o.n]||[]).push(o));
  return{list,set:new Set(words),byLen,size:words.length};
}
function fits(a,bm){for(const k in a.m){if((bm[k]||0)<a.m[k])return false;}return true;}
function lenFor(k){return k<=5?4:k<=20?5:k<=50?6:(k%2?7:6);}
function formableOf(ix,b){return ix.list.filter(x=>x.n>=3&&x.n<=b.n&&fits(x,b.m));}
function buildLevel(ix,b,k,f){
  const r=rng(k*104729+7);
  const rest=shuffle(f.filter(x=>x.w!==b.w),r).sort((x,y)=>y.n-x.n).slice(0,11).map(x=>x.w);
  const targets=[b.w,...rest].sort((x,y)=>toks(x).length-toks(y).length||(x<y?-1:1));
  return{base:b.w,tiles:toks(b.w),targets};
}
function genLevel(ix,k,used){
  const r=rng(k*7919+13);
  const big=ix.size>5000;
  const min=big?(k<=5?3:5):3;
  for(const L of [lenFor(k),5,6,4,7]){
    const pool=ix.byLen[L]; if(!pool||!pool.length) continue;
    const tries=big?300:pool.length*3;
    for(let a=0;a<tries;a++){
      const b=pool[Math.floor(r()*pool.length)];
      if(used.has(b.w)) continue;
      const f=formableOf(ix,b);
      if(f.length<min) continue;
      return buildLevel(ix,b,k,f);
    }
  }
  return null;
}
/*END LOGIC*/

/* ===== O'yin ===== */
const $=id=>document.getElementById(id);
const KEY='uzSozOyin1';
let IX,CUR=null;
let ST={level:1,coins:20,found:[],bonus:[],hints:{},bases:[]};
let TS=[],POS=[],sel=[],dragging=false,toastT;

function save(){try{localStorage.setItem(KEY,JSON.stringify(ST));}catch(e){}}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&s.level)ST=Object.assign(ST,s);}catch(e){}}
function toast(t){$('toast').textContent=t;clearTimeout(toastT);toastT=setTimeout(()=>$('toast').textContent='',1600);}
function getLevel(k){
  const bw=ST.bases[k-1];
  if(bw){
    const b=(IX.byLen[toks(bw).length]||[]).find(o=>o.w===bw);
    if(b) return buildLevel(IX,b,k,formableOf(IX,b));
  }
  const g=genLevel(IX,k,new Set(ST.bases.filter(Boolean)));
  if(g){ST.bases[k-1]=g.base;save();}
  return g;
}
function renderTop(){$('lvl').textContent=ST.level;$('coins').textContent=ST.coins;}
function isFound(w){return ST.found.includes(w)||(ST.hints[w]||0)>=toks(w).length;}

function renderSlots(){
  const L=CUR,box=$('slots');box.innerHTML='';
  L.targets.forEach(w=>{
    const row=document.createElement('div');row.className='word';
    const t=toks(w),f=isFound(w),h=ST.hints[w]||0;
    t.forEach((x,i)=>{
      const b=document.createElement('div');b.className='box';
      if(f){b.classList.add('on');b.textContent=x;}
      else if(i<h){b.classList.add('hint');b.textContent=x;}
      row.appendChild(b);
    });
    box.appendChild(row);
  });
}
function buildWheel(reshuffle){
  const L=CUR,wheel=$('wheel');
  if(reshuffle||!TS.length) TS=shuffle(L.tiles,Math.random);
  wheel.innerHTML='';POS=[];sel=[];
  const n=TS.length,C=145,R=145-48;
  TS.forEach((x,i)=>{
    const a=2*Math.PI*i/n-Math.PI/2,px=C+R*Math.cos(a),py=C+R*Math.sin(a);
    POS.push([px,py]);
    const d=document.createElement('div');d.className='tile'+(x.length>1?' two':'');d.dataset.i=i;d.textContent=x;
    d.style.left=px+'px';d.style.top=py+'px';wheel.appendChild(d);
  });
  draw();
}
function draw(){
  document.querySelectorAll('.tile').forEach(t=>t.classList.toggle('sel',sel.includes(+t.dataset.i)));
  const w=sel.map(i=>TS[i]).join('');
  $('cur').textContent=w;$('cur').classList.toggle('show',sel.length>0);
  $('trail').innerHTML=sel.length>1?'<polyline fill="none" stroke="#22c55e" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity=".8" points="'+sel.map(i=>POS[i].join(',')).join(' ')+'"/>':'';
}
function startLevel(){
  TS=[];$('done').classList.add('hidden');renderTop();renderSlots();buildWheel(true);
  $('dictInfo').textContent="Lug'at: "+IX.size+" ta so'z";
}
function allDone(){return CUR.targets.every(isFound);}

function submit(w,len){
  if(len<3){if(len>1)toast('Kamida 3 ta harf');return;}
  const L=CUR;
  if(L.targets.includes(w)){
    if(isFound(w)){toast("Bu so'z topilgan");return;}
    ST.found.push(w);toast('✔ To\'g\'ri!');renderSlots();save();
    if(allDone())levelDone();
  }else if(IX.set.has(w)){
    if(ST.bonus.includes(w)){toast("Bonus so'z topilgan");return;}
    ST.bonus.push(w);ST.coins+=1;toast("✨ Bonus so'z! +1 🪙");save();renderTop();
  }else toast("Bunday so'z yo'q");
}
function levelDone(){
  ST.coins+=5;save();renderTop();
  $('doneT').textContent='Bosqich '+ST.level+' yakunlandi! 🎉';
  $('doneP').textContent='+5 🪙 oldingiz. Bonus so\'zlar: '+ST.bonus.length;
  $('nextBtn').classList.remove('hidden');$('done').classList.remove('hidden');
}
$('nextBtn').onclick=()=>{
  const prev=CUR;
  ST.level++;ST.found=[];ST.bonus=[];ST.hints={};
  CUR=getLevel(ST.level);
  if(!CUR){
    ST.level--;CUR=prev;save();
    $('doneT').textContent='Tabriklaymiz! 🏆';
    $('doneP').textContent="Lug'atdagi barcha bosqichlarni tugatdingiz. Ko'proq bosqich uchun katta lug'at (words.txt) qo'shing.";
    $('nextBtn').classList.add('hidden');return;
  }
  save();startLevel();
};
$('shuf').onclick=()=>buildWheel(true);
$('hint').onclick=()=>{
  if(ST.coins<5){toast('Tanga yetarli emas');return;}
  const L=CUR,left=L.targets.filter(w=>!isFound(w));
  if(!left.length)return;
  const w=left[Math.floor(Math.random()*left.length)];
  ST.hints[w]=(ST.hints[w]||0)+1;ST.coins-=5;save();renderTop();renderSlots();
  if(allDone())levelDone();
};

const wheelEl=$('wheelBox');
function pick(e){
  const el=document.elementFromPoint(e.clientX,e.clientY),t=el&&el.closest&&el.closest('.tile');
  if(!t)return;const i=+t.dataset.i;
  if(sel[sel.length-1]===i)return;
  if(sel.length>1&&sel[sel.length-2]===i)sel.pop();
  else if(!sel.includes(i))sel.push(i);
  draw();
}
function finish(){
  if(!dragging)return;dragging=false;
  const w=sel.map(i=>TS[i]).join(''),len=sel.length;
  sel=[];draw();submit(w,len);
}
wheelEl.addEventListener('pointerdown',e=>{e.preventDefault();try{wheelEl.setPointerCapture(e.pointerId);}catch(x){}dragging=true;sel=[];pick(e);});
wheelEl.addEventListener('pointermove',e=>{if(dragging)pick(e);});
wheelEl.addEventListener('pointerup',finish);
wheelEl.addEventListener('pointercancel',finish);

async function init(){
  load();
  let words=parseWords(BUILTIN_TEXT.split(/\s+/).join('\n'));
  try{
    const r=await fetch('words.txt',{cache:'no-cache'});
    if(r.ok){const w=parseWords(await r.text());if(w.length>500)words=[...new Set([...words,...w])];}
  }catch(e){}
  IX=mkIndex(words);
  CUR=getLevel(ST.level);
  if(!CUR){ST.level=Math.max(1,ST.bases.filter(Boolean).length);CUR=getLevel(ST.level);}
  if(!CUR){document.body.textContent="Lug'at juda kichik.";return;}
  ST.found=ST.found.filter(w=>CUR.targets.includes(w));
  startLevel();
  if(allDone())levelDone();
}
init();
</script>
